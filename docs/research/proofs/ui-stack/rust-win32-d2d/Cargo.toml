# Hello-window launch benchmark: Rust + windows-rs, raw Win32 window,
# Direct3D 11 + DXGI flip swap chain + Direct2D + DirectWrite.
# Build: cargo build --release   (exe: target/release/pfw-bench-rust-win32-d2d.exe)
[package]
name = "pfw-bench-rust-win32-d2d"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
