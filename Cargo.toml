[package]
name = "preview-for-windows"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
windows-numerics = "=0.3.1"
# `#[implement]` (the OLE drop target) expands to `::windows_core` paths.
windows-core = "=0.62.2"
windows-collections = "=0.3.2"
image-webp = "=0.2.4"
accesskit = "=0.25.1"
accesskit_windows = "=0.35.1"
libwebp-sys = "=0.14.4"

[dependencies.ort]
version = "=2.0.0-rc.13"
default-features = false
features = ["std", "load-dynamic", "directml", "api-24"]

[dependencies.windows]
version = "=0.62.2"
features = [
    "Foundation", "Globalization", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "UI_ViewManagement",
    "ApplicationModel_DataTransfer", "Storage",
    "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm", "Win32_Graphics_Imaging", "Win32_System_Com",
    "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Threading",
    "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_Security", "Win32_System_DataExchange",
    "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip",
    "Win32_UI_Controls", "Win32_UI_Input_Pointer", "Win32_UI_Accessibility", "Win32_System_Registry", "Win32_Media_MediaFoundation",
    "Win32_UI_Input_Ime"
]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
